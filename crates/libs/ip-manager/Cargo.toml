[package]
name = "ip-manager"
version.workspace = true
edition = "2024"
license = "MPL-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["postgres"]
# PostgreSQL store (`postgres::PostgresDb`) used by the split dora-v4/v6/api
# services and `dora-migrate`.
postgres = ["dep:sqlx"]
# Embedded single-process redb store (`redb::RedbDb`) used by `dora-embedded`.
# `tempfile` is a normal (optional) dep because `RedbDb::new_test` is public for
# downstream crates' tests, like `PostgresDb::new_test`.
redb = ["dep:redb", "dep:postcard", "dep:serde", "dep:tokio", "dep:tempfile"]

[dependencies]
config = { path = "../../libs/config" }
icmp-ping = { path = "../icmp-ping" }
client-protection = { path = "../client-protection" }

async-trait = { workspace = true }
ipnet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = [
    "log",
] } # TODO: do we need the log feature?
moka = { version = "0.12.16", features = ["future"] }
# TODO: hopefully the rustls feature can go away, the lib requires it
# sqlx 0.7 split the combined runtime+tls feature and made offline mode part of
# the default `macros` feature. `tls-rustls-ring` keeps the ring backend (now
# on the patched 0.17 line) instead of pulling in aws-lc-rs.
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",
    "macros",
    "migrate",
] }
redb = { version = "4.3", optional = true }
# no default features: `heapless-cas` would drag in heapless -> atomic-polyfill
# -> spin (unmaintained / yanked, RUSTSEC-2023-0089), none of which a std build
# needs.
postcard = { version = "1.1", default-features = false, features = [
    "use-std",
], optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio-test = "0.4.6"
tracing = { workspace = true, features = ["log"] }
tokio = { workspace = true }
tracing-test = { workspace = true }
rand = { workspace = true }
